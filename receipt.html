<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ใบเสร็จรับเงินมัดจำ</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", "Noto Sans Thai", sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 20px;
  }
  .toolbar {
    max-width: 420px;
    margin: 0 auto 16px auto;
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }
  .toolbar button {
    cursor: pointer;
    border: none;
    border-radius: 6px;
    padding: 8px 16px;
    background: #2563eb;
    color: white;
    font-size: 0.9rem;
  }
  .toolbar a.back-link { font-size: 0.85rem; color: #2563eb; margin-right: auto; align-self: center; text-decoration: none; }

  .receipt {
    max-width: 420px;
    margin: 0 auto;
    background: white;
    padding: 24px;
    border: 1px dashed #cbd5e1;
    border-radius: 8px;
  }
  .receipt h1 { font-size: 1.1rem; text-align: center; margin: 0 0 4px 0; }
  .receipt .sub { text-align: center; color: #64748b; font-size: 0.8rem; margin-bottom: 16px; }
  .receipt hr { border: none; border-top: 1px dashed #cbd5e1; margin: 12px 0; }
  .row { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 6px; }
  .row .label { color: #64748b; }
  .deposit-box {
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
    border-radius: 6px;
    padding: 12px;
    text-align: center;
    margin: 16px 0;
  }
  .deposit-box .amount { font-size: 1.6rem; font-weight: bold; color: #16a34a; }
  .deposit-box .caption { font-size: 0.8rem; color: #15803d; }
  .note-box { font-size: 0.85rem; color: #334155; background: #f8fafc; padding: 10px; border-radius: 6px; margin-top: 10px; }
  .signature-area { display: flex; justify-content: space-between; margin-top: 40px; font-size: 0.8rem; color: #64748b; }
  .signature-area div { text-align: center; width: 45%; }
  .signature-line { border-top: 1px solid #94a3b8; margin-top: 30px; padding-top: 4px; }
  .not-found { text-align: center; color: #888; padding: 60px 20px; }

  @media print {
    body { background: white; padding: 0; }
    .toolbar { display: none; }
    .receipt { border: none; box-shadow: none; max-width: 100%; }
  }
</style>
</head>
<body>
  <div class="toolbar">
    <a class="back-link" href="app.html">← กลับหน้าหลัก</a>
    <button onclick="window.print()">🖨️ พิมพ์ใบเสร็จ</button>
  </div>

  <div id="receiptContainer"></div>

  <script src="js/auth.js"></script>
  <script>requireAuth();</script>
  <script src="js/storage.js"></script>
  <script>
    function escapeHtml(s) {
      const div = document.createElement("div");
      div.textContent = s;
      return div.innerHTML;
    }

    function shortReceiptNo(id) {
      return id.replace(/-/g, "").slice(0, 8).toUpperCase();
    }

    function formatDateThai(iso) {
      const d = new Date(iso);
      return d.toLocaleString("th-TH", { dateStyle: "medium", timeStyle: "short" });
    }

    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    const item = id ? getItemById(id) : null;
    const container = document.getElementById("receiptContainer");

    if (!item) {
      container.innerHTML = '<div class="not-found">ไม่พบรายการสินค้านี้ (อาจถูกลบไปแล้ว)</div>';
    } else {
      const shopName = getShopName();
      const receiptNo = shortReceiptNo(item.id);
      const now = new Date().toISOString();

      container.innerHTML = `
        <div class="receipt">
          <h1>${escapeHtml(shopName)}</h1>
          <div class="sub">ใบเสร็จรับเงินมัดจำ</div>
          <hr />
          <div class="row"><span class="label">เลขที่ใบเสร็จ</span><span>#${receiptNo}</span></div>
          <div class="row"><span class="label">วันที่ออกใบเสร็จ</span><span>${formatDateThai(now)}</span></div>
          <div class="row"><span class="label">วันที่จองสินค้า</span><span>${escapeHtml(item.date)}</span></div>
          ${item.flags.customer_name ? `<div class="row"><span class="label">ลูกค้า</span><span>${escapeHtml(item.flags.customer_name)}</span></div>` : ""}
          <hr />
          <div class="row"><span class="label">รายการสินค้า</span><span>${escapeHtml(item.name)}</span></div>
          ${item.flags.note ? `<div class="note-box">📝 ${escapeHtml(item.flags.note)}</div>` : ""}

          <div class="deposit-box">
            <div class="caption">ยอดมัดจำที่รับแล้ว</div>
            <div class="amount">฿${Number(item.flags.deposit_amount || 0).toLocaleString("th-TH")}</div>
          </div>

          <div class="signature-area">
            <div><div class="signature-line">ผู้รับเงิน</div></div>
            <div><div class="signature-line">ลูกค้า</div></div>
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
