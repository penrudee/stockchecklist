<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/x-icon" href="favicon.ico">
<title>เข้าสู่ระบบ - จดบันทึกสินค้าขาด</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <h1>🔐 เข้าสู่ระบบ</h1>
      <div id="loginError" class="login-error" style="display:none;"></div>
      <input id="username" type="text" placeholder="ชื่อผู้ใช้" autocomplete="username" />
      <input id="password" type="password" placeholder="รหัสผ่าน" autocomplete="current-password" />
      <button id="btnLogin">เข้าสู่ระบบ</button>
      <p class="login-hint">
        ค่าเริ่มต้น: <b>admin / admin</b> — เปลี่ยนได้ที่หน้าตั้งค่าหลังล็อกอิน<br />
        ต้องการแค่ค้นหาสินค้า? <a href="shopee.html">Shopee (ไม่ต้องล็อกอิน)</a>
      </p>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    // ถ้าล็อกอินอยู่แล้ว ข้ามไปหน้าแอปเลย
    ensureDefaultAuth().then(() => {
      if (isLoggedIn()) window.location.href = "app.html";
    });

    async function doLogin() {
      const u = document.getElementById("username").value.trim();
      const p = document.getElementById("password").value;
      const ok = await login(u, p);
      if (ok) {
        window.location.href = "app.html";
      } else {
        const err = document.getElementById("loginError");
        err.textContent = "ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง";
        err.style.display = "block";
      }
    }

    document.getElementById("btnLogin").addEventListener("click", doLogin);
    document.getElementById("password").addEventListener("keydown", (e) => {
      if (e.key === "Enter") doLogin();
    });
  </script>
</body>
</html>
