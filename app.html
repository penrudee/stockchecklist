<!-- app.html -->
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>จดบันทึกสินค้าขาด</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>📋 จดบันทึกสินค้าขาด</h1>
    <nav>
      <a href="app.html">หน้าหลัก</a>
      <a href="stats.html">สถิติ</a>
      <a href="settings.html">ตั้งค่า</a>
      <a href="shopee.html" target="_blank">หน้าค้นหาสินค้า</a>
      <a href="admin.html">Admin</a>
    </nav>
    <div class="topbar-actions">
      <span id="whoami" style="font-size:0.85rem;color:#cbd5e1;"></span>
      <button id="btnLogout" class="ghost">ออกจากระบบ</button>
    </div>
  </header>

  <section class="search-row">
    <div class="autocomplete-wrap">
      <input id="searchOldInput" type="text" placeholder="ค้นหารายการที่เคยจด..." autocomplete="off" />
      <div id="searchSuggestions" class="suggestions hidden"></div>
    </div>

    <button id="btnNewItem">➕ สร้างรายการใหม่</button>

    <div id="newItemBox" class="new-item-box hidden">
      <input id="newItemInput" type="text" placeholder="พิมพ์ชื่อสินค้าแล้วกด Enter..." autocomplete="off" />
      <div id="newItemSuggestions" class="suggestions hidden"></div>
    </div>
  </section>

  <section class="filter-row">
    <input id="filterName" type="text" placeholder="กรองตามชื่อ..." />
    <label>จาก <input id="filterDateFrom" type="date" /></label>
    <label>ถึง <input id="filterDateTo" type="date" /></label>
    <button id="btnApplyFilter">กรอง</button>
    <button id="btnClearFilter" class="ghost">ล้างตัวกรอง</button>
  </section>

  <main id="tableContainer" class="table-container"></main>

  <!-- Modal: โน้ตสั้น + มัดจำ -->
  <div id="noteModalOverlay" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="noteModalTitle">
    <div class="modal-box" id="noteModalBox">
      <h2 id="noteModalTitle">📝 โน้ต / มัดจำ</h2>
      <label>ชื่อลูกค้า (ถ้ามี)
        <input id="modalCustomerName" type="text" placeholder="เช่น คุณสมชาย" />
      </label>
      <label>โน้ตสั้น
        <input id="modalNote" type="text" placeholder="เช่น ลูกค้าสั่งจอง" />
      </label>
      <label>ยอดมัดจำ (บาท)
        <input id="modalDeposit" type="number" min="0" step="1" placeholder="0" inputmode="numeric" />
      </label>
      <div class="modal-actions">
        <button id="modalSave">บันทึก</button>
        <button id="modalCancel" class="ghost" type="button">ยกเลิก</button>
      </div>
    </div>
  </div>

  <footer class="footer">
    <span id="summaryText">กำลังโหลดสรุป...</span>
  </footer>

  <script src="js/auth.js"></script>
  <script>requireAuth();</script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
