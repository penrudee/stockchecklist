<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - A 2nd Brain | Stocklist</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/auth-a2ndbrain.css">
    <!-- Google Identity Services Identity SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    
</head>
<body>

    <div class="login-card">
        <!-- Logo Header -->
        <div class="brand-logo">
            <!-- Brain / Knowledge Graph Icon -->
            <svg viewBox="0 0 24 24">
                <path d="M12 2a9 9 0 0 1 9 9c0 3.6-2.1 6.7-5.2 8.1l-1.8 3.9H9.8l-1.7-3.9A9.01 9.01 0 0 1 3 11a9 9 0 0 1 9-9z"></path>
                <circle cx="12" cy="11" r="3"></circle>
                <path d="M12 8v0M8.5 13l-1.5 1.5M15.5 13l1.5 1.5"></path>
            </svg>
        </div>

        <h1>A 2nd Brain</h1>
        <p class="subtitle">ระบบบันทึกความคิดและเชื่อมโยงความรู้สไตล์ Digital Garden สำหรับ Stocklist</p>

        <!-- Google Login Integration -->
        <div id="g_id_onload"
             data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
             data-context="signin"
             data-ux_mode="popup"
             data-callback="handleCredentialResponse"
             data-auto_prompt="false">
        </div>

        <div class="google-btn-container">
            <div class="g_id_signin"
                 data-type="standard"
                 data-shape="pill"
                 data-theme="filled_black"
                 data-text="signin_with"
                 data-size="large"
                 data-logo_alignment="left">
            </div>
        </div>

        <!-- Feature Overview -->
        <div class="features-list">
            <div class="feature-item">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                </svg>
                <span>จัดเก็บโน๊ตความรู้และไอเดียอย่างเป็นระบบ</span>
            </div>
            <div class="feature-item">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                </svg>
                <span>เชื่อมโยงข้อมูลด้วย Bi-directional Links</span>
            </div>
            <div class="feature-item">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                </svg>
                <span>ซิงค์ข้อมูลปลอดภัยผ่าน Google Account</span>
            </div>
        </div>

        <p class="footer-text">
            การเข้าสู่ระบบถือว่ายอมรับ <a href="#">เงื่อนไขการใช้งาน</a> และ <a href="#">นโยบายความเป็นส่วนตัว</a>
        </p>
    </div>

    <script>
        // ฟังก์ชัน Decode JWT Token จาก Google Response
        function parseJwt (token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));

            return JSON.parse(jsonPayload);
        }

        // Callback function หลังจากผู้ใช้กด Sign-in ผ่าน Google
        function handleCredentialResponse(response) {
            if (response.credential) {
                // Decode ข้อมูลผู้ใช้
                const userPayload = parseJwt(response.credential);
                
                console.log("ID Token:", response.credential);
                console.log("User Profile:", userPayload);

                // บันทึก Session/User ไว้ใน localStorage หรือ sessionStorage
                localStorage.setItem('user_session', JSON.stringify({
                    email: userPayload.email,
                    name: userPayload.name,
                    picture: userPayload.picture,
                    token: response.credential
                }));

                // Redirect ไปยังหน้า a2nd-brain.html
                window.location.href = 'a2nd-brain.html';
            }
        }

        // ตรวจสอบเบื้องต้น หากเคยเข้าสู่ระบบแล้ว ให้ redirect ไปยังหน้า a2nd-brain.html ทันที
        window.addEventListener('DOMContentLoaded', () => {
            const savedSession = localStorage.getItem('user_session');
            if (savedSession) {
                // window.location.href = 'a2nd-brain.html';
            }
        });
    </script>
</body>
</html>
